services:
  - type: web
    name: cardioai-assist
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardioai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: ENABLE_XAI
        value: "true"
      - key: MODEL_DIR
        value: /app/models
      - key: MODEL_THRESHOLD
        value: "0.72"
      - key: MODEL_VERSION
        value: raw-inceptiontime-se-nested-v1
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTO_INIT_DB
        value: "true"
      - key: AUTO_CREATE_ADMIN
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"

databases:
  - name: cardioai-db
    plan: free
    region: frankfurt
    databaseName: cardioai
    user: cardioai
