{% extends "base.html" %}
{% block title %}Connexion - CardioAI Assist{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">Connexion</h1><p class="text-muted">Accès au prototype du projet de fin d'études.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="email">Adresse e-mail</label><input class="form-control" id="email" name="email" type="email" required autocomplete="username"></div><div class="mb-3"><label class="form-label" for="password">Mot de passe</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary w-100" type="submit">Se connecter</button></form></div></div></div></div>
{% endblock %}
